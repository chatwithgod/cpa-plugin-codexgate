name: Native build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.8'
  GOTOOLCHAIN: local

jobs:
  native:
    name: Verify ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.9'
      - name: Select pinned Windows C compiler
        if: runner.os == 'Windows'
        run: python scripts/fetch_tools.py llvm-mingw --github-env CC
      - name: Select pinned macOS C compiler
        if: runner.os == 'macOS'
        run: |
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"
      - name: Build, package, install and run isolated CPA
        run: python scripts/ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*/${{ matrix.target }}/
          if-no-files-found: error

  linux:
    name: Verify linux-${{ matrix.arch }} (GLIBC 2.17)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Native build and host verification in pinned GLIBC 2.17 container
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          image=$(python3 -c 'import json,os; print(json.load(open("scripts/toolchains.json"))["manylinux"][os.environ["ARCH"]])')
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -v "$(go env GOROOT):/opt/go:ro" -w /src \
            -e HOME=/tmp/codexgate-build -e GOTOOLCHAIN=local -e CC=gcc \
            "$image" bash -euo pipefail -c '
              mkdir -p "$HOME"
              export PATH="/opt/go/bin:/opt/python/cp312-cp312/bin:$PATH"
              git config --global --add safe.directory /src
              python scripts/ci.py
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*/linux-${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [native, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Verify all five platforms and assemble release
        run: python3 scripts/assemble_release.py --artifacts artifacts --tag "$GITHUB_REF_NAME"
      - name: Upload all assets before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          gh release create "$GITHUB_REF_NAME" dist/release/"$version"/* \
            --verify-tag --draft --title "CodexGate $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
